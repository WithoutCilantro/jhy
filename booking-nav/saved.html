<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>已保存 · Booking 下导航</title>

  <style>
    :root {
      --booking-nav-icon-size: 20px;
      --booking-nav-color: #222;
      --booking-nav-muted: #666;
      --booking-nav-border: #dddddd;
      --booking-nav-background: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      padding-bottom: calc(78px + env(safe-area-inset-bottom));
      color: #222;
      background: #f5f7fa;
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }

    .booking-demo {
      width: min(100% - 32px, 900px);
      margin: 40px auto;
      padding: 32px;
      border-radius: 16px;
      background: #ffffff;
    }

    .booking-demo h1 {
      margin: 0 0 12px;
      font-size: 28px;
    }

    .booking-demo p {
      margin: 0;
      color: #666;
      line-height: 1.7;
    }

    /* 隐藏内联 SVG 图标库，不影响页面布局 */
    .booking-svg-sprite {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
      pointer-events: none;
    }

    /* 底部导航 */
    .booking-bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 0;
      z-index: 1200;
      display: flex;
      width: min(100%, 900px);
      min-height: 64px;
      padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--booking-nav-border);
      background: var(--booking-nav-background);
      transform: translateX(-50%);
      box-shadow: 0 -4px 18px rgba(0, 0, 0, 0.06);
    }

    .booking-bottom-nav__item {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 2px;
      color: var(--booking-nav-muted);
      font-size: 12px;
      line-height: 1.2;
      text-align: center;
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .booking-bottom-nav__item:visited,
    .booking-bottom-nav__item:hover,
    .booking-bottom-nav__item:active {
      color: var(--booking-nav-color);
    }

    .booking-bottom-nav__item[aria-current="page"] {
      color: var(--booking-nav-color);
      font-weight: 700;
    }

    .booking-bottom-nav__item:focus-visible {
      outline: 2px solid #222;
      outline-offset: -3px;
      border-radius: 8px;
    }

    .booking-bottom-nav__icon {
      display: block;
      flex: 0 0 var(--booking-nav-icon-size);
      width: var(--booking-nav-icon-size);
      height: var(--booking-nav-icon-size);
      color: currentColor;
      overflow: visible;
    }

    @media (max-width: 680px) {
      .booking-demo {
        margin: 20px auto;
        padding: 22px;
      }

      .booking-demo h1 {
        font-size: 24px;
      }

      .booking-bottom-nav__item {
        font-size: 11px;
      }
    }
      .demo-kicker {
      display: inline-block;
      margin-bottom: 8px;
      color: #006ce4;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .14em;
    }
  </style>
  <link rel="stylesheet" href="../course-nav.css">
</head>

<body>
  <a class="course-back" href="../index.html" aria-label="返回课程作品集">← 返回作品集</a>
  <main class="booking-demo">
    <span class="demo-kicker">SAVED</span>
    <h1>已保存</h1>
    <p>这里用于展示收藏的酒店与目的地，底部导航中的“已保存”保持高亮。</p>
  </main>

  <!-- 内联 SVG 图标库 -->
  <svg class="booking-svg-sprite" aria-hidden="true" focusable="false">
    <symbol id="booking-icon-search" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"></circle>
      <path d="m16.5 16.5 4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
    </symbol>

    <symbol id="booking-icon-saved" viewBox="0 0 24 24">
      <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z" fill="none" stroke="currentColor" stroke-width="1.8"></path>
    </symbol>

    <symbol id="booking-icon-order" viewBox="0 0 24 24">
      <rect x="3" y="5" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"></rect>
      <path d="M7 3v4M17 3v4M3 10h18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
    </symbol>

    <symbol id="booking-icon-account" viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.8"></circle>
      <path d="M4 21a8 8 0 0 1 16 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
    </symbol>
  </svg>

  <!-- 底部导航 -->
  <nav class="booking-bottom-nav" aria-label="Booking 下导航">
    <a
      class="booking-bottom-nav__item"
      href="./search.html"
      aria-current="page">
      <svg class="booking-bottom-nav__icon" viewBox="0 0 24 24" aria-hidden="true">
        <use href="#booking-icon-search"></use>
      </svg>
      <span>搜索</span>
    </a>

    <a class="booking-bottom-nav__item" href="./search.html?view=saved" aria-current="page">
      <svg class="booking-bottom-nav__icon" viewBox="0 0 24 24" aria-hidden="true">
        <use href="#booking-icon-saved"></use>
      </svg>
      <span>已保存</span>
    </a>

    <a class="booking-bottom-nav__item" href="./trips.html">
      <svg class="booking-bottom-nav__icon" viewBox="0 0 24 24" aria-hidden="true">
        <use href="#booking-icon-order"></use>
      </svg>
      <span>订单</span>
    </a>

    <a class="booking-bottom-nav__item" href="./account.html">
      <svg class="booking-bottom-nav__icon" viewBox="0 0 24 24" aria-hidden="true">
        <use href="#booking-icon-account"></use>
      </svg>
      <span>我的账号</span>
    </a>
  </nav>
</body>
</html>
