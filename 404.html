<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>页面未找到 | 高级网页设计</title>
    <style>
        * { box-sizing: border-box; }
        body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 20px; color: #14213d; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: radial-gradient(circle at 20% 20%, #dbeafe, transparent 35%), linear-gradient(145deg, #f4f8ff, #eef7ff); }
        main { width: min(620px, 100%); padding: 48px 36px; text-align: center; border: 1px solid rgba(37, 99, 235, .12); border-radius: 28px; background: rgba(255,255,255,.9); box-shadow: 0 28px 70px rgba(14, 35, 80, .16); }
        .code { color: #2563eb; font-size: clamp(4rem, 18vw, 8rem); font-weight: 900; line-height: 1; letter-spacing: -.08em; }
        h1 { margin: 14px 0 10px; font-size: clamp(1.6rem, 5vw, 2.4rem); }
        p { margin: 0 auto; max-width: 460px; color: #52627a; line-height: 1.8; }
        a { display: inline-flex; margin-top: 28px; padding: 13px 20px; color: #fff; font-weight: 800; text-decoration: none; border-radius: 14px; background: #2563eb; box-shadow: 0 12px 28px rgba(37,99,235,.25); }
        a:hover { background: #173a8f; }
    </style>
</head>
<body>
    <main>
        <div class="code">404</div>
        <h1>这个页面还没有进入作品集</h1>
        <p>链接可能已经更新，或者对应的课堂练习尚未上传。返回课程主页即可继续浏览全部作品。</p>
        <a href="./index.html">返回课程主页</a>
    </main>
</body>
</html>
